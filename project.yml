name: DBDeck
options:
  bundleIdPrefix: br.dev.dbdeck
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
packages:
  PostgresNIO:
    url: https://github.com/vapor/postgres-nio
    from: 1.25.0
  MySQLNIO:
    path: ThirdParty/mysql-nio
  NIOSSL:
    url: https://github.com/apple/swift-nio-ssl
    from: 2.25.0
targets:
  DBDeckCore:
    type: framework
    platform: macOS
    sources:
      - Sources/DBDeckCore
    dependencies:
      - package: PostgresNIO
      - package: MySQLNIO
      - package: NIOSSL
    settings:
      base:
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        GENERATE_INFOPLIST_FILE: YES
  DBDeck:
    type: application
    platform: macOS
    sources:
      - Sources/DBDeckApp
    dependencies:
      - target: DBDeckCore
    settings:
      base:
        PRODUCT_NAME: DBDeck
        MARKETING_VERSION: "0.2.5"
        CURRENT_PROJECT_VERSION: "7"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        SWIFT_VERSION: "6.0"
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_CFBundleDisplayName: DBDeck
        COMBINE_HIDPI_IMAGES: YES

  # MARK: iOS
  # O core é o mesmo código; o target separado existe porque o framework macOS é
  # assinado ad-hoc e embutido pelo install.sh — misturar plataformas num target só
  # renomearia os produtos de que o script depende.
  DBDeckCoreiOS:
    type: framework
    platform: iOS
    sources:
      - Sources/DBDeckCore
    dependencies:
      - package: PostgresNIO
      - package: MySQLNIO
      - package: NIOSSL
    settings:
      base:
        PRODUCT_NAME: DBDeckCore
        PRODUCT_BUNDLE_IDENTIFIER: br.dev.dbdeck.DBDeckCore
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
  DBDeckMobile:
    type: application
    platform: iOS
    sources:
      - Sources/DBDeckMobile
      # Estado e preferências são os mesmos do Mac: uma regra de conexão/túnel/abas só.
      - Sources/DBDeckApp/AppState.swift
      - Sources/DBDeckApp/ConnectionSession.swift
      - Sources/DBDeckApp/AppSettings.swift
      - Sources/DBDeckApp/Theme.swift
      - Sources/DBDeckApp/Views/Editor/SQLSyntaxHighlighter.swift
    dependencies:
      - target: DBDeckCoreiOS
    settings:
      base:
        PRODUCT_NAME: DBDeck
        PRODUCT_BUNDLE_IDENTIFIER: br.dev.dbdeck.mobile
        MARKETING_VERSION: "0.2.5"
        CURRENT_PROJECT_VERSION: "7"
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: DBDeck
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "O DBDeck acessa servidores de banco de dados na sua rede local."
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UISupportsDocumentBrowser: NO
        INFOPLIST_KEY_UIFileSharingEnabled: YES
  DBDeckMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests/DBDeckMobileUITests
    dependencies:
      - target: DBDeckMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.dev.dbdeck.mobile.uitests
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: DBDeckMobile
schemes:
  DBDeckMobile:
    build:
      targets:
        DBDeckMobile: all
    test:
      targets:
        - DBDeckMobileUITests
